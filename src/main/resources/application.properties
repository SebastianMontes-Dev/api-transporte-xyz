spring.application.name=transporte
server.port=8080

# Base de datos en memoria, se reinicia con la aplicacion
spring.datasource.url=jdbc:h2:mem:transporte
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# La consola de H2 queda apagada para no exponer endpoints publicos
spring.h2.console.enabled=false

# Credenciales de acceso (autenticacion basica)
seguridad.administrador.usuario=admin
seguridad.administrador.clave=admin123
seguridad.supervisor.usuario=supervisor
seguridad.supervisor.clave=supervisor123
